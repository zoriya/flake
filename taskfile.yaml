version: "3"

tasks:
  switch:
    desc: switch to new version
    cmds:
      - cmd: nixos-rebuild switch --flake path:. --show-trace
        platforms: [linux]
      - cmd: darwin-rebuild switch --flake path:. --show-trace
        platforms: [darwin]

  update:
    desc: update all deps
    cmds:
      - nix flake update
    env:
      NIX_CONFIG:
        sh: echo "extra-access-tokens = github.com=$(gh auth token)"

  btrfs:
    desc: create the btrfs subvolumes on the fs labeled nix (run once, after mkfs)
    cmds:
      - mkdir -p /mnt
      - mount /dev/disk/by-label/nix /mnt
      - defer: umount /mnt
      - for: ["@root", "@tmp", "@nix", "@persist", "@swap"]
        cmd: btrfs subvolume create /mnt/{{.ITEM}}

  install:*:
    desc: install config of $1 to disk.
    vars:
      HOST: "{{index .MATCH 0}}"
    cmds:
      - task: password:root
      - task: password:zoriya
      - mount -o subvol=@root,compress=zstd,noatime /dev/disk/by-label/nix /mnt
      - mkdir -p /mnt/{boot,nix,persist}
      - mount -o subvol=@nix,compress=zstd,noatime /dev/disk/by-label/nix /mnt/nix
      - mount -o subvol=@persist,compress=zstd,noatime /dev/disk/by-label/nix /mnt/persist
      - mount /dev/disk/by-label/boot /mnt/boot
      - task: swap
      - defer: { task: swap-off }
      - mkdir -p /mnt/persist/tmp
      - TMPDIR=/mnt/persist/tmp nixos-install --no-channel-copy --no-root-password --flake path:.#{{.HOST}}

  password:*:
    desc: setup passwords
    vars:
      USER: "{{index .MATCH 0}}"
    cmds:
      - nix-shell -p mkpasswd --run 'mkpasswd -m SHA-512 | tr -d \\n > password/{{.USER}}'
    status:
      - test -f password/{{.USER}}

  swap:
    desc: setup swap file (for live usb mostly)
    cmds:
      - btrfs filesystem mkswapfile --size 20G --uuid clear /mnt/nix/swap
      - swapon /mnt/nix/swap
  swap-off:
    cmds:
      - swapoff /mnt/nix/swap
      - rm /mnt/nix/swap
